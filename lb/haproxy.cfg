# =====================================================================
#  Libra - Load Balancer (Lab 3)
#  Single entry point in front of the stateless backend pool.
#
#  Balancing algorithm and weights come from environment variables, so the
#  algorithm can be switched without editing this file:
#    LB_ALGO      roundrobin (default) | leastconn | source (IP hash) | random
#    APPn_WEIGHT  1..256, default 1  -> Weighted Round Robin when they differ
# =====================================================================

global
    log stdout format raw local0 info
    maxconn 4096
    # Runtime API (show stat, set weight, disable server ...):
    #   docker compose exec lb sh -c "echo 'show servers state' | nc 127.0.0.1 9999"
    stats socket ipv4@127.0.0.1:9999 level admin

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor              # X-Forwarded-For with the real client IP
    timeout connect 2s
    timeout client  60s
    timeout server  60s
    timeout queue   10s
    timeout http-request 10s
    timeout http-keep-alive 5s

    # --- passive fault tolerance --------------------------------------
    # A request that could not be delivered (connection refused / reset,
    # node stopped) is retried on ANOTHER server instead of failing.
    retries 2
    option redispatch 1
    # Layer-7 retries (empty reply / 502-504 from a dying node) are allowed
    # only for idempotent methods, so a POST is never executed twice.
    retry-on conn-failure empty-response response-timeout 502 503 504

# Docker's embedded DNS: replicas may get new IPs after a restart.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid    5s
    hold other    5s
    hold refused  5s
    hold nx       5s
    hold timeout  5s
    hold obsolete 5s

frontend http_in
    bind :8080
    default_backend libra_pool
    # Which algorithm served the request - handy during the defence.
    http-response set-header X-LB-Algorithm "${LB_ALGO-roundrobin}"

backend libra_pool
    balance "${LB_ALGO-roundrobin}"
    hash-type consistent           # used by "source": adding a node remaps ~1/N clients only
    http-request disable-l7-retry if !METH_GET !METH_HEAD   # see "retry-on" above

    # --- active health check -------------------------------------------
    # GET /health = readiness (DB + session store). 503 -> node removed.
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host lb
    http-check expect status 200

    # inter 2s, fall 2  -> a dead/degraded node leaves the pool in <= ~4 s
    # rise 2            -> it returns after two successful checks
    # slowstart 10s     -> a recovered node gets traffic gradually (warm-up)
    # observe layer7 + on-error mark-down -> PASSIVE check: 10 consecutive
    #                      5xx/failed real requests also mark the node down
    default-server check inter 2s fastinter 1s downinter 3s fall 2 rise 2 slowstart 10s observe layer7 error-limit 10 on-error mark-down maxconn 200 resolvers docker init-addr last,libc,none

    server app1 app1:8000 weight "${APP1_WEIGHT-1}"
    server app2 app2:8000 weight "${APP2_WEIGHT-1}"
    server app3 app3:8000 weight "${APP3_WEIGHT-1}"

# Live dashboard: per-server sessions, request counts, health state.
listen stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 2s
    stats show-legends
